name: Render FilmSimulation roadmap

on:
  push:
    paths:
      - roadmap/filmsimulation_roadmap.csv
      - render_roadmap.py
      - .github/workflows/render-roadmap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer and CJK font
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Render roadmap from event commit
        run: |
          output="$RUNNER_TEMP/roadmap"
          mkdir -p "$output"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python render_roadmap.py roadmap/filmsimulation_roadmap.csv --output-base "$output/filmsimulation_roadmap"
          test -s "$output/filmsimulation_roadmap.svg"
          test -s "$output/filmsimulation_roadmap.png"
          printf '%s\n' "$GITHUB_SHA" > "$output/source-commit.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Upload roadmap images and source SHA
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-${{ github.sha }}
          path: ${{ runner.temp }}/roadmap/
          if-no-files-found: error
